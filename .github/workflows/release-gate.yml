name: Release gate

on:
  push:
    tags:
      - gate-v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: gate/go.sum

      - name: Build
        working-directory: gate
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o kronk-gate-arm64 .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: gate/kronk-gate-arm64
