name: CI gate

on:
  pull_request:
    paths:
      - gate/**

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: gate/go.sum

      - name: Vet
        working-directory: gate
        run: go vet ./...

      - name: Build
        working-directory: gate
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o kronk-gate-arm64 .
